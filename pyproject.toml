[project]
name = "ws-aitoolkit"
version = "0.1.4"
description = "Your memory, skills and rules, in any AI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Michael Fry" }]
# The core has no runtime dependencies: stdlib only, so the install works the same on every OS.
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Source = "https://github.com/Michael-A-Fry/ws"
Documentation = "https://github.com/Michael-A-Fry/ws/blob/main/docs/README.md"
Changelog = "https://github.com/Michael-A-Fry/ws/blob/main/CHANGELOG.md"
Issues = "https://github.com/Michael-A-Fry/ws/issues"
Security = "https://github.com/Michael-A-Fry/ws/blob/main/SECURITY.md"

[project.scripts]
ws = "ws.cli:main"

[dependency-groups]
dev = ["jsonschema==4.26.0", "pytest==9.0.3"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ws"

[tool.uv]
# Hold new upstream releases for a week before they can enter the lock.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
