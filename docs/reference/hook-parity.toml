# The hook parity table: one row per class of hook a hand-built set has (a user-level hook that ...), what replaced it in ws,
# and what it does when it crashes or cannot decide. docs/reference/hook-parity.md is generated from this file
# (python3 scripts/gen_hook_parity.py); tests/test_hook_parity.py reads it. Humans edit this file, never the page.
#
# status: covered (a ws rule or guard does it; `test` names the test), planned (a later wave builds it; `wave` says which),
#         estate (one person's own setup; `ws` says why), dropped (`ws` says why).
# fail:   blocks (a crash or doubt denies the call) or never-blocks (the hook only advises or records).

[[hook]]
id = "irreversible-shell"
what = "Blocks irreversible shell commands: recursive deletes of system folders, forced pushes, disk formatting"
ws = "`[gate] deny_commands` (the default list covers these; add your own patterns)"
status = "covered"
fail = "blocks"
test = "test_parity_irreversible_shell_commands"

[[hook]]
id = "credential-reads"
what = "Blocks reads of credential files and key stores, by a shell command or by a file tool"
ws = "`[gate] deny_read`, applied to shell words, Read, Grep and Glob alike"
status = "covered"
fail = "blocks"
test = "test_parity_credential_reads"

[[hook]]
id = "terminal-session-keys"
what = "Stops one session sending keystrokes to, or killing, another terminal-multiplexer session"
ws = "A `deny_commands` pattern you add (such as `tmux kill-*`); which sessions to protect depends on how you work"
status = "estate"
fail = "blocks"
test = "none"

[[hook]]
id = "sealed-folders"
what = "Keeps a session out of folders sealed off for a class of repository (reads and writes)"
ws = "`[gate] deny_read` and `allow_write`, and the sandbox's `denyRead`; the list of sealed folders is yours"
status = "covered"
fail = "blocks"
test = "test_parity_sealed_folders"

[[hook]]
id = "guardrail-files"
what = "Lets the files that hold the guardrails be edited only by the session that owns them"
ws = "ws protects its own policy, settings, hooks and folders from the edit tools and from shell redirects; the `config-guard` guard covers the edit tools for files and folders you name, edited only from the owner folders you list (a write through a link or to a file with more than one name is refused too); shell redirects to them are for the sandbox's write-deny list, which the guard doesn't judge"
status = "covered"
fail = "blocks"
test = "test_parity_guardrail_files, test_parity_config_guard"

[[hook]]
id = "bulk-staging"
what = "Blocks staging the whole tree (`git add -A`, `git add .`, `git commit -a`)"
ws = "the `bulk-staging` guard"
status = "covered"
fail = "blocks"
test = "test_parity_bulk_staging"

[[hook]]
id = "claims"
what = "Checks a claim that a commit is merged or pushed before the message goes"
ws = "the `claims` guard"
status = "covered"
fail = "blocks"
test = "test_parity_claims"

[[hook]]
id = "session-context"
what = "Tells a new session which state and hand-off files exist"
ws = "the `session-context` guard"
status = "covered"
fail = "never-blocks"
test = "test_parity_session_context"

[[hook]]
id = "skill-gate"
what = "Makes a session load a skill before it writes certain files"
ws = "the `skill-gate` guard"
status = "covered"
fail = "blocks"
test = "test_parity_skill_gate"

[[hook]]
id = "spawn-cap"
what = "Caps how many subagents run at once"
