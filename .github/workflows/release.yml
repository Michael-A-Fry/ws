# Release: a `vX.Y.Z` tag builds the sdist and wheel, writes a SHA-256 for each asset and a CycloneDX SBOM, attests build
# provenance, signs every asset with cosign (keyless), publishes one immutable GitHub release, then uploads to PyPI by
# trusted publishing. `workflow_dispatch` only does the build job (a dry run) on the ref it was dispatched on: nothing is attested,
# signed or published, and no tag needs to exist. Version rule: the tag must equal `v` + the version in pyproject.toml, or the build fails; the workflow never
# rewrites the version, so the sdist, the wheel and the tree at the tag all say the same thing. Each job holds only the
# permissions it uses. Actions are pinned by commit SHA (version in the comment).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check against (vX.Y.Z; empty = v + the pyproject version). Builds the dispatched ref, publishes nothing"
        required: false
        type: string
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  build:
    name: build, checksums, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: the tag is a plain vX.Y.Z
        run: |
          if [ -z "$TAG" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then exit 0; fi  # set from pyproject below
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not vX.Y.Z"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a release builds the tag; a dry run builds the ref it was dispatched on (no tag needs to exist yet)
          ref: ${{ github.event_name == 'push' && format('refs/tags/{0}', env.TAG) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: false
      - name: the tag equals v + the version in pyproject.toml, and is on main
        id: meta
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ -z "$TAG" ]; then TAG="v$version"; echo "TAG=$TAG" >> "$GITHUB_ENV"; fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version; bump the version and tag again"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::refs/tags/$TAG is not the commit this run started from ($GITHUB_SHA); the tag moved"; exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::$TAG is not on main; releases are cut from main"; exit 1
            fi
            echo "::warning::this commit is not on main yet; a release from it would be refused"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: stamp the build (src/ws/_build.py, git-ignored; `ws version` reads it)
        run: |
          sha="$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain)" ]; then dirty=True; else dirty=False; fi
          printf '"""Written by the release workflow before `uv build`; absent in a checkout."""\n\ngit_sha = "%s"\ndirty = %s\nbuild_date = "%s"\nsource = "release"\n' \
            "$sha" "$dirty" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/ws/_build.py
          cat src/ws/_build.py
      - name: release notes from the CHANGELOG section for this version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } /^\[[^]]+\]: / { next } f' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section with text in it"; exit 1
          fi
          if grep -q "^## \[$VERSION\].*unreleased" CHANGELOG.md; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::CHANGELOG.md still says '## [$VERSION] - unreleased'; put the date in before tagging"; exit 1
            fi
            echo "::warning::CHANGELOG.md still says '## [$VERSION] - unreleased'; put the date in"
          fi
          cat release-notes.md
      - name: uv build (sdist and wheel)
        run: uv build
      - name: install the wheel in a clean environment; it reports this commit, and the SBOM is read from that environment
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" "dist/ws_aitoolkit-$VERSION-py3-none-any.whl"
          "$RUNNER_TEMP/wheel-env/bin/ws" version --json | tee "$RUNNER_TEMP/version.json"
          python3 - "$RUNNER_TEMP/version.json" "$(git rev-parse HEAD)" "$VERSION" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))["data"]
          assert data["git_sha"] == sys.argv[2], data
          assert data["version"] == sys.argv[3], data
          assert data["install_source"] == "release", data
          assert data["dirty"] is False, data
          PY
          # cyclonedx-bom is pinned; --exclude-newer holds its own dependencies to versions at least 7 days old
          uvx --exclude-newer "7 days" --from cyclonedx-bom==7.5.0 cyclonedx-py environment \
            --pyproject pyproject.toml --mc-type application --of JSON \
            -o "dist/ws_aitoolkit-$VERSION.cdx.json" "$RUNNER_TEMP/wheel-env/bin/python"
      - name: a SHA-256 file for each asset (sha256sum format, file name only)
        working-directory: dist
        run: |
          for f in *.whl *.tar.gz *.cdx.json; do sha256sum "$f" > "$f.sha256"; done
          sha256sum -c ./*.sha256
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  attest-sign:
    name: attest provenance, sign with cosign
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
      - name: the files are the ones the build wrote
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: cosign sign-blob, keyless, one bundle per asset; each bundle is verified before it is published
        working-directory: dist
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          for f in *.whl *.tar.gz *.cdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: "GitHub release (immutable, every asset in this one step)"
    if: github.event_name == 'push'
    needs: [build, attest-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist # for release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist
      - name: the files are still the ones the build wrote
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          body_path: release-notes.md
          draft: false
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sha256
            dist/*.sigstore.json

  pypi:
    name: PyPI (trusted publishing)
    if: github.event_name == 'push'
    needs: [build, attest-sign, release] # after the release, so a failure here leaves the GitHub release standing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist
      - name: the sdist and the wheel only
        run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
          ls -l pypi-dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/

  # The pass test (install-test.yml): a release made with this workflow's token fires no `release` event, so start it here.
  install-test:
    name: start the install test
    needs: [build, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: gh workflow run install-test.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh workflow run install-test.yml --ref main -f tag="$TAG" -f latest=true
