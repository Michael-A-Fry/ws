[[hook]]
id = "launch-from-main"
what = "Refuses to launch isolated agents or workflows from anywhere but a repository's main checkout"
ws = "the `guard-launch` guard: a workflow, or an agent that asks for a worktree, starts only from a repository's main checkout"
status = "covered"
fail = "blocks"
test = "test_parity_launch_from_main"

[[hook]]
id = "workflow-fresh"
