# Prose lint for README.md, docs/ and the policy files. CI runs `vale sync` then `vale` (ci.yml); only errors fail.
# The Microsoft package is pinned to a release; the synced copy under .github/vale/ is git-ignored.
StylesPath = .github/vale
MinAlertLevel = error
Vocab = ws
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip

[*.md]
BasedOnStyles = Microsoft
