# Run locally with prek (`uvx prek install` once; then on every commit). CI runs the same hooks (ci.yml).
# Pins: tags at least 7 days old when chosen (31 Oct 2026).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.0
    hooks:
      - id: rumdl-check
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: code-map
        name: AGENTS.md code map is current (python3 scripts/gen_code_map.py rewrites it)
        entry: python3 scripts/gen_code_map.py --check
        language: system
        files: ^(src/ws/.*\.py|AGENTS\.md|scripts/gen_code_map\.py)$
        pass_filenames: false
      - id: pii-gate
        name: PII gate (private IPs, tailnet hosts, e-mails, private denylist)
        entry: python3 scripts/pii_gate.py
        language: system
        types: [text]
      - id: ws-globals
        name: ws globals (no repo copy of a global skill, agent, workflow or hook)
        entry: uv run --locked ws globals check
        language: system
        pass_filenames: false
        always_run: true
        verbose: true # prints "nothing to compare" in CI, where there is no user config
