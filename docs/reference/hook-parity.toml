test = "none"

[[hook]]
id = "syntax-check"
what = "Checks that a file parses right after a session writes it"
ws = "the `syntax-check` guard (a finding is a message to the model, never a block)"
status = "covered"
fail = "never-blocks"
test = "test_parity_syntax_check"

[[hook]]
id = "force-push-main"
what = "Blocks a force-push to, or deletion of, the main branch on a remote"
ws = "the default `deny_commands` list: every forcing or destroying push, in any spelling (`--force`, `-f`, `+ref`, `--delete`, `-d` alone or among other flags such as `-qd`, an empty source as in `origin :branch`, `--mirror`, `--prune`), whatever the branch; a ref deleted through the host's own API (`gh api -X DELETE`) is a network call this list doesn't read"
status = "covered"
fail = "blocks"
test = "test_parity_force_push_main"

[[hook]]
id = "env-file-write"
what = "Blocks a shell command that writes a secret `.env` file"
ws = "the policy reader: the target of every redirect and the operand of every writing command (`tee`, `cp`, `mv`, `sed -i`, `dd of=`) is checked by file name against `.env`, `.envrc` and `.env.NAME` (a template such as `.env.example` is free), after quoting, heredocs and variables set on the line are resolved; a target the reader can't know is refused. A glob that can name one (`.e*`, `.en?`) and a copy into a folder (`cp ../x/.env .`) are read; `rm .env` is refused too. Not read: an interpreter that opens the file itself, `find -exec`, and `git checkout`/`git restore` of the file"
status = "covered"
fail = "blocks"
test = "test_parity_env_file_write"

[[hook]]
id = "scheduled-branch-move"
what = "Blocks a headless job moving the branch of a main checkout"
ws = "the `checkout-pin` guard: no session, a timer's job included, can move the branch of a main checkout that has linked worktrees, so no job marker is needed"
status = "covered"
fail = "blocks"
test = "test_parity_scheduled_branch_move"

[[hook]]
id = "commit-wall"
what = "Scans the staged diff and the commit message for patterns the person supplies"
ws = "`ws commit-wall`, installed by `core.hooksPath`: the added lines of the staged diff and the commit message are checked against patterns the person supplies (ws ships none); a merge is scanned for the lines new to it, nothing is skipped (every file is read as text, file names and the whole message included), a check with no pattern refuses, `git am` and a push are checked too (a commit made with no commit hook is caught at the push), an exceptions file only a person edits lets a line through, and a hook that can't run ws blocks the commit"
status = "covered"
fail = "blocks"
test = "test_parity_commit_wall"

[[hook]]
id = "test-run-discipline"
what = "Requires test commands to run in the foreground through a wrapper that serialises and bounds them"
ws = "none; the wrapper is one person's tool (a `deny_commands` pattern can ask for yours)"
status = "estate"
fail = "blocks"
test = "none"

[[hook]]
id = "duplicate-session"
what = "Warns when two live sessions share a session id or a folder"
ws = "none; it reads one person's session files"
status = "estate"
fail = "never-blocks"
test = "none"
