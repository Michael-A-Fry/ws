# TEMPORARY (C708): reproduce the macOS ConnectionRefused flake in tests/test_ui.py. Never merge; deleted before the PR is ready.
name: c708-repro
on:
  workflow_dispatch:
  push:
    branches: [c708-test-ui-macos]  # dispatch needs the file on main; a push whose message says [repro] runs it
permissions: read-all
jobs:
  ui30:
    name: test_ui x30 (macos-26)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[repro]')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
      - name: tests/test_ui.py 30 times
        run: |
          fails=0
          for i in $(seq 1 30); do
            if ! uv run --locked pytest -q tests/test_ui.py > "$RUNNER_TEMP/ui-$i.log" 2>&1; then
              fails=$((fails + 1)); echo "::group::run $i FAILED"; cat "$RUNNER_TEMP/ui-$i.log"; echo "::endgroup::"
            fi
          done
          echo "C708-RESULT test_ui x30: $fails failed runs"
          [ "$fails" -eq 0 ]
  full:
    name: full suite ${{ matrix.n }} (macos-26)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[repro]')
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
      - name: tests (same command as doctor)
        env:
          CORE_BUDGET: "900"
        run: uv run --locked pytest -q -rs -o ws_tier_budget_core="$CORE_BUDGET"
