# Run locally with prek (`uvx prek install` once; then on every commit). CI runs the same hooks (ci.yml).
# Pins: tags at least 7 days old when chosen (31 Oct 2026).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.0
    hooks:
      - id: rumdl-check
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: pii-gate
        name: PII gate (private IPs, tailnet hosts, e-mails, private denylist)
        entry: python3 scripts/pii_gate.py
        language: system
        types: [text]
