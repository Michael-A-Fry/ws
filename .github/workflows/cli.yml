# Phase 2 pass test on three OSs: on a fresh machine `ws doctor` exits non-zero listing every role unconfigured.
# Phase 3 pass test (gate-e2e): a denied command is blocked on both runners, against a stub model, no paid provider.
# Phase 4 (gate-e2e): the sandbox wall stops the bypasses the matcher cannot see; the OpenCode session nudge fires.
# Phase 5 (matrix-e2e, wsl, windows-native): the person's path, timed on every cell (install -> first task -> uninstall,
# scripts/e2e_first_task.sh), and a credential-free smoke with no provider key set. The lab VM cell is lab.yml.
# Nightly, and on pull requests that touch the CLI. Not a required check: a slow or flaky runner never blocks a PR.
name: cli
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/check_fresh_doctor.py"
      - "install.sh"
      - "scripts/e2e_first_task.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cli.yml"
  schedule:
    - cron: "17 14 * * *" # 02:17 or 03:17 in Auckland
  workflow_dispatch:
permissions: read-all
concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  doctor:
    name: doctor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
      - name: tests
        run: uv run --locked pytest -q
      # bash 3.2 on macOS and bash 5 on Linux both have to read it; --dry-run changes nothing on the runner
      - name: install.sh --help and --dry-run
        run: |
          bash install.sh --help
          bash install.sh --dry-run
      - name: fresh doctor exits non-zero, every role unconfigured
        run: |
          export WS_HOME="$RUNNER_TEMP/wshome"
          set +e; uv run --locked ws doctor --json > "$RUNNER_TEMP/doctor.json"; code=$?; set -e
          uv run --locked python scripts/check_fresh_doctor.py "$RUNNER_TEMP/doctor.json" "$code"

  gate-e2e:
    name: gate e2e (ubuntu-24.04, stub model)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Pinned in tests/e2e/runners/package-lock.json (versions released at least 7 days before pinning, 31 Oct 2026).
      # No install scripts run, except the two each runner needs to unpack its own native binary.
      - name: install the runners
        working-directory: tests/e2e/runners
        run: |
          npm ci --ignore-scripts
          node node_modules/opencode-ai/postinstall.mjs
          node node_modules/@anthropic-ai/claude-code/install.cjs
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      # The sandbox wall: Claude Code's native sandbox needs bubblewrap and socat; `ws gate launch` needs bubblewrap.
      # tmux and screen are the host daemons the wall tests try to reach (systemd-run --user needs a user manager, which
      # a CI runner does not have, so that one test skips). Versions are the ubuntu-24.04 image's own (bubblewrap 0.9,
      # socat 1.8 at the time of writing). That image
      # switches off unprivileged user namespaces for unconfined programs with AppArmor, which bubblewrap needs, so the
      # restriction is lifted for this throwaway runner only.
      - name: install the sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat tmux screen
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
      - name: a denied command is blocked on Claude Code (deny list, hook) and OpenCode (deny list, shim)
        env:
          WS_E2E_REQUIRE: "1" # a missing runner fails the job instead of skipping
        run: uv run --locked pytest -q tests/e2e/test_gate_runners.py
      - name: the sandbox stops what the matcher cannot see, and the host-socket escapes; the OpenCode nudge and approvals work
        env:
          WS_E2E_REQUIRE: "1" # missing bubblewrap or a runner fails the job instead of skipping
        run: uv run --locked pytest -q tests/e2e/test_sandbox.py tests/e2e/test_wall_escapes.py tests/e2e/test_wall_loadpaths.py tests/e2e/test_opencode_nudge.py

  # Phase 3 pass test (row 3): a job's run record is complete against its schema on both runners. Same stub model, plus
  # a real broker lease to a stub upstream; no paid provider.
  run-e2e:
    name: run record e2e (ubuntu-24.04, stub model)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: install the runners (versions released at least 7 days before pinning, 31 Oct 2026)
        run: npm install --global @anthropic-ai/claude-code@2.1.308 opencode-ai@1.19.4
      # The generated Claude Code settings turn its sandbox on with failIfUnavailable, so `ws run` on claude needs the
      # same tools as the gate job (a run ends in error without them: that is the fail-closed behaviour, not a bug).
      - name: install the sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: the run record validates and is complete on Claude Code (bare) and OpenCode
        env:
          WS_E2E_REQUIRE: "1" # a missing runner fails the job instead of skipping
        run: uv run --locked pytest -q tests/e2e/test_run_record.py

  # Phase 3 pass test: no secret is readable by the agent user (ws-dev), yet its lease request gets a proxied call
  # whose upstream sees the injected header. The wall is built by running the commands `ws secret wall` prints (this
  # runner has passwordless sudo and systemd), then the pass test runs against that result.
  secret-wall:
    name: secret wall (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
      - name: install
        run: uv sync --locked
      - name: run the commands `ws secret wall` prints
        run: |
          # GitHub's runner image leaves /opt writable by everyone; the wall refuses to install under such a folder
          sudo chmod go-w /opt
          export WS_HOME="$RUNNER_TEMP/wshome"
          mkdir -p "$WS_HOME"
          printf '[anthropic]\nhosts = ["api.anthropic.com"]\npurposes = ["run"]\n' > "$WS_HOME/secrets.toml"
          uv run --locked ws secret wall > "$RUNNER_TEMP/wall.sh"
          cat "$RUNNER_TEMP/wall.sh"
          # the printed "secret set" lines ask a person to paste a new key; there is nobody to ask here
          grep -v ' secret set ' "$RUNNER_TEMP/wall.sh" > "$RUNNER_TEMP/wall-run.sh"
          bash -euo pipefail "$RUNNER_TEMP/wall-run.sh"
          systemctl is-active ws-broker
      - name: add the agent user and an outsider
        run: |
          sudo useradd --create-home --shell /bin/bash --groups ws-clients ws-dev
          sudo useradd --create-home --shell /bin/bash ws-other
      - name: the pass test
        env:
          WS_E2E_REQUIRE: "1"
        run: uv run --locked pytest -q -rs tests/e2e/test_secret_wall.py

  # Phase 5 pass test (row 5): one timed run of install -> doctor -> setup -> first task -> rate -> uninstall, against the
  # mock provider (no network model, no real key), on a throw-away HOME and a WS_HOME with a space in its path. The
  # timing file is the artifact; the summary line goes to the job summary. /bin/bash is bash 3.2 on macOS.
  matrix-e2e:
    name: first task e2e (${{ matrix.os }}, mock model)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: credential-free smoke (no provider key set, WS_HOME with a space)
        env:
          WS_SMOKE_CMD: uv run --locked ws
          WS_E2E_CELL: ${{ matrix.os }}
        run: /bin/bash scripts/e2e_first_task.sh --smoke
      # Pinned in tests/e2e/runners/package-lock.json, as in gate-e2e.
      - name: install the runners
        working-directory: tests/e2e/runners
        run: |
          npm ci --ignore-scripts
          node node_modules/opencode-ai/postinstall.mjs
          node node_modules/@anthropic-ai/claude-code/install.cjs
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      # Claude Code's sandbox needs bubblewrap and socat on Linux (and macOS has its own); see gate-e2e for why the sysctl.
      - name: install the sandbox tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: first task, timed
        env:
          WS_E2E_CELL: ${{ matrix.os }}
          WS_E2E_OUT: ${{ github.workspace }}/e2e-timing.json
        run: /bin/bash scripts/e2e_first_task.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timing-${{ matrix.os }}
          path: e2e-timing.json
          if-no-files-found: warn

  wsl:
    name: doctor (windows-2025, WSL2 Ubuntu-24.04)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates nodejs npm bubblewrap socat
      - name: tests and fresh doctor inside WSL2
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          v=0.13.1; sum=eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
          curl -sSfL -o /tmp/uv.tgz "https://github.com/astral-sh/uv/releases/download/$v/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$sum  /tmp/uv.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/uv.tgz -C "$HOME/.local/bin" --strip-components=1
          export PATH="$HOME/.local/bin:$PATH"
          # copy off the Windows drive: a venv on /mnt is slow and loses Unix permissions
          rm -rf "$HOME/ws" && cp -r . "$HOME/ws" && cd "$HOME/ws"
          uv run --locked pytest -q
          export WS_HOME="$HOME/wshome"
          set +e; uv run --locked ws doctor --json > /tmp/doctor.json; code=$?; set -e
          uv run --locked python scripts/check_fresh_doctor.py /tmp/doctor.json "$code"
      - name: credential-free smoke inside WSL2
        if: ${{ !cancelled() }} # independent of the test step above
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/ws"
          WS_SMOKE_CMD="uv run --locked ws" WS_E2E_CELL=wsl2-ubuntu-24.04 /bin/bash scripts/e2e_first_task.sh --smoke
      # The timing file goes back to the Windows workspace (WSLENV translates the two paths) so it can be uploaded.
      - name: first task, timed, inside WSL2
        if: ${{ !cancelled() }} # independent of the test step above
        shell: wsl-bash {0}
        env:
          WSLENV: GITHUB_WORKSPACE/p:GITHUB_STEP_SUMMARY/p
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/ws/tests/e2e/runners"
          npm ci --ignore-scripts
          node node_modules/opencode-ai/postinstall.mjs
          node node_modules/@anthropic-ai/claude-code/install.cjs
          export PATH="$PWD/node_modules/.bin:$PATH"
          cd "$HOME/ws"
          WS_E2E_CELL=wsl2-ubuntu-24.04 WS_E2E_OUT="$GITHUB_WORKSPACE/e2e-timing.json" /bin/bash scripts/e2e_first_task.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timing-wsl2
          path: e2e-timing.json
          if-no-files-found: warn

  windows-native:
    name: doctor (windows-2025 native, points at WSL2)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
      - name: native doctor fails WS001 with the WSL2 fix, every role unconfigured
        run: |
          export WS_HOME="$RUNNER_TEMP/wshome"
          set +e; uv run --locked ws doctor --json > "$RUNNER_TEMP/doctor.json"; code=$?; set -e
          uv run --locked python scripts/check_fresh_doctor.py "$RUNNER_TEMP/doctor.json" "$code" --native-windows
      - name: credential-free smoke (no provider key set, WS_HOME with a space)
        env:
          WS_SMOKE_CMD: uv run --locked ws
          WS_E2E_CELL: windows-2025-native
        run: bash scripts/e2e_first_task.sh --smoke
